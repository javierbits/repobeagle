# Generated by `repobeagle init`. Bump the ref below together with the tool.
name: repobeagle
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
jobs:
  scan:
    permissions:
      contents: write      # publish the badge branch
      statuses: write      # set the repobeagle/scan commit status
      id-token: write      # keyless-sign the report
    uses: javierbits/repobeagle/.github/workflows/scan.yml@v1.170.0
    with:
      profile: balanced
      fail-on-red: false
      privacy-only: false
      badge-branch: "repobeagle"
      set-status: true
      tools-ref: v1.170.0

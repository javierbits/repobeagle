# Reusable workflow: scan a repository with RepoBeagle and publish the verdict
# as a badge + full report. Authors opt in with:
#
#   name: repobeagle
#   on:
#     push:
#       branches: [main]
#       tags: ["v*"]
#   jobs:
#     scan:
#       permissions:
#         contents: write        # publishes the badge branch (optional)
#         statuses: write        # sets the repobeagle/scan commit status (optional)
#         id-token: write        # required: keyless-signs the report with Sigstore
#         security-events: write # required: the called workflow requests it (upload-sarif)
#       uses: javierbits/repobeagle/.github/workflows/scan.yml@main
#       with:
#         profile: balanced   # strict | balanced | relaxed
#         fail-on-red: false  # true = the job fails on a RED verdict (PR gate)
#         baseline: false     # true = fail only on findings added since the last published report
#         baseline-min-severity: high  # severity of a new finding that fails the baseline gate
#         privacy-only: false # true = badge only privacy/telemetry findings
#         scan-ref: ""        # e.g. a PR head SHA, or refs/pull/<n>/head for a fork PR
#         changed-since: ""   # e.g. the PR base SHA: scan only the diff (a diff verdict, not full-repo)
#
# The badge is self-attested: it lives in this repository. The report is signed
# with Sigstore keyless signing; the signing identity is THIS workflow file in
# the javierbits/repobeagle repo, which callers cannot edit, so a valid signature
# proves the official pipeline produced the report. See the README.
name: repobeagle-scan
on:
  workflow_call:
    inputs:
      profile:
        description: "Verdict profile: strict, balanced or relaxed"
        required: false
        default: "balanced"
        type: string
      fail-on-red:
        description: "Fail the job when the verdict is RED"
        required: false
        default: false
        type: boolean
      baseline:
        description: "Fail only on findings added since the last published report on the badge branch (needs badge-branch)"
        required: false
        default: false
        type: boolean
      baseline-min-severity:
        description: "Severity of a new finding that fails the baseline gate: critical, high, medium, low or info"
        required: false
        default: "high"
        type: string
      privacy-only:
        description: "Publish a privacy-only verdict (only privacy/telemetry findings)"
        required: false
        default: false
        type: boolean
      badge-branch:
        description: "Branch to publish badge.json and the report to (empty = do not publish)"
        required: false
        default: "repobeagle"
        type: string
      set-status:
        description: "Set a repobeagle/scan commit status on the scanned commit"
        required: false
        default: true
        type: boolean
      tools-ref:
        description: "repobeagle toolchain ref to run (the VERSION file there pins the image)"
        required: false
        default: "main"
        type: string
      scan-ref:
        description: "Scan this branch/tag/commit instead of the default branch (e.g. a PR head SHA or refs/pull/<n>/head)"
        required: false
        default: ""
        type: string
      changed-since:
        description: "Only scan files changed since this revision (diff verdict; must be a git-reachable rev, e.g. the PR base SHA)"
        required: false
        default: ""
        type: string
      upload-sarif:
        description: "Upload findings to GitHub code scanning (needs security-events: write)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  statuses: write
  id-token: write
  security-events: write   # only used when upload-sarif is true; harmless otherwise

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      TOOLS_REF: ${{ inputs.tools-ref }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0            # full sha so the commit status always resolves
      - name: Check out the repobeagle toolchain
        uses: actions/checkout@v4
        with:
          repository: javierbits/repobeagle
          ref: ${{ inputs.tools-ref }}
          path: .repobeagle-tools

      - name: Install repobeagle (pinned image + osv-scanner)
        run: bash .repobeagle-tools/install.sh

      - name: Record scan environment
        run: |
          set -euo pipefail
          V="$(cat .repobeagle-tools/VERSION)"
          D="$(docker image inspect "ghcr.io/javierbits/repobeagle:$V" --format '{{index .RepoDigests 0}}' 2>/dev/null || echo unavailable)"
          {
            echo "IMAGE_REF=ghcr.io/javierbits/repobeagle:$V"
            echo "IMAGE_DIGEST=$D"
          } >> "$GITHUB_ENV"

      # The toolchain (scanner code, fixtures, README with attack examples) and the
      # output dir must never be part of the scanned tree, or repobeagle scans itself.
      - name: Relocate toolchain and output out of the scanned tree
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/repobeagle-tools"
          OUT="$RUNNER_TEMP/repobeagle-out"
          rm -rf "$TOOLS" "$OUT"
          mv .repobeagle-tools "$TOOLS"
          mkdir -p "$OUT"
          {
            echo "TOOLS=$TOOLS"
            echo "OUT=$OUT"
          } >> "$GITHUB_ENV"

      - name: Fetch the last published report as the baseline
        if: inputs.baseline && inputs.badge-branch != ''
        continue-on-error: true            # a missing branch is "no baseline yet", not a failure
        run: |
          set -euo pipefail
          B="$BADGE_BRANCH"
          if git clone -q --depth 1 --branch "$B" \
               "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/baseline" 2>/dev/null \
             && [ -s "$RUNNER_TEMP/baseline/report.json" ]; then
            cp "$RUNNER_TEMP/baseline/report.json" "$OUT/baseline.json"
            python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));m=d.get("meta") or {};print("baseline: %s %s" % (d.get("verdict"), str(m.get("scanned_sha","?"))[:12]))' "$OUT/baseline.json"
          else
            echo "no report on the $B branch yet: the baseline gate will be skipped"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          BADGE_BRANCH: ${{ inputs.badge-branch }}

      - name: Scan
        id: scan
        run: |
          set -e
          case "$PROFILE" in
            strict)   S=--strict ;;
            relaxed)  S=--relaxed ;;
            *)        S=--balanced ;;
          esac
          if [ "$PRIVACY_ONLY" = "true" ]; then S="$S --privacy-only"; fi
          if [ -n "$SCAN_REF" ]; then S="$S --ref $SCAN_REF"; fi
          if [ -n "$CHANGED_SINCE" ]; then S="$S --since $CHANGED_SINCE"; fi
          # --ref/--since need a git URL; a plain local-directory scan is the default.
          TARGET=.
          if [ -n "$SCAN_REF" ] || [ -n "$CHANGED_SINCE" ]; then TARGET="https://github.com/$GITHUB_REPOSITORY"; fi
          set +e
          python3 "$TOOLS/repobeagle.py" scan $TARGET $S --json "$OUT/beagle.json" --no-color
          rc=$?
          set -e
          if [ ! -s "$OUT/beagle.json" ] || [ "$rc" -gt 2 ]; then
            echo "repobeagle scan crashed (rc=$rc), no report"
            exit 1
          fi
          python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print("rc=%d" % ({"GREEN":0,"YELLOW":1,"RED":2}[d["verdict"]],));print("verdict=%s" % d["verdict"])' "$OUT/beagle.json" >> "$GITHUB_OUTPUT"
          python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print("verdict:",d["verdict"],d["counts"]);s=(d.get("meta") or {}).get("scope");print("scope:",s) if s else None' "$OUT/beagle.json"
        env:
          PROFILE: ${{ inputs.profile }}
          PRIVACY_ONLY: ${{ inputs.privacy-only }}
          SCAN_REF: ${{ inputs.scan-ref }}
          CHANGED_SINCE: ${{ inputs.changed-since }}

      - name: Attach provenance to the report
        run: |
          python3 -c 'import json,os,sys;p=sys.argv[1];d=json.load(open(p));m=d.setdefault("meta",{});m.update(image_ref=os.environ["IMAGE_REF"],image_digest=os.environ["IMAGE_DIGEST"],toolchain_ref=os.environ["TOOLS_REF"],run_url=os.environ["RUN_URL"],scanned_repo=os.environ["GITHUB_REPOSITORY"],scanned_sha=(m.get("commit") or os.environ["GITHUB_SHA"]));json.dump(d,open(p,"w"),indent=2)' "$OUT/beagle.json"

      - name: Export SARIF
        if: inputs.upload-sarif
        run: python3 "$TOOLS/repobeagle.py" export "$OUT/beagle.json" --format sarif -o "$OUT/beagle.sarif"

      - name: Upload findings to GitHub code scanning
        if: inputs.upload-sarif
        continue-on-error: true            # needs security-events: write and code scanning enabled
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ env.OUT }}/beagle.sarif

      - name: Make badge
        run: |
          python3 "$TOOLS/tools/make_badge.py" "$OUT/beagle.json" \
            --endpoint "$OUT/badge.json" --svg "$OUT/badge.svg" \
            --link "$RUN_URL"
      - name: Install cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign the report (keyless)
        continue-on-error: true            # a missing bundle means "unverified", never "verified"
        run: cosign sign-blob --yes --bundle "$OUT/report.sigstore.json" "$OUT/beagle.json"

      - name: Publish badge branch
        if: inputs.badge-branch != ''
        continue-on-error: true            # needs contents: write; degrades to a plain scan otherwise
        run: |
          set -euo pipefail
          B="$BADGE_BRANCH"
          W="$(mktemp -d)"
          git -c init.defaultBranch=main init -q "$W"
          git -C "$W" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$W" config user.email "repobeagle[bot]@users.noreply.github.com"
          git -C "$W" config user.name "repobeagle-badge"
          if git -C "$W" ls-remote --exit-code --heads origin "$B" >/dev/null 2>&1; then
            git -C "$W" fetch -q origin "$B"
            git -C "$W" checkout -q FETCH_HEAD
          else
            git -C "$W" checkout -q --orphan "$B"
          fi
          cp "$OUT/badge.json" "$W/badge.json"
          cp "$OUT/badge.svg" "$W/badge.svg"
          cp "$OUT/beagle.json" "$W/report.json"
          cp "$OUT/beagle.json" "$W/report-${GITHUB_SHA:0:7}.json"
          if [ -f "$OUT/report.sigstore.json" ]; then
            cp "$OUT/report.sigstore.json" "$W/report.sigstore.json"
          fi
          if [ "$REF_TYPE" = "tag" ]; then
            cp "$OUT/badge.json" "$W/badge-$REF_NAME.json"
            cp "$OUT/beagle.json" "$W/report-$REF_NAME.json"
          fi
          git -C "$W" add -A
          git -C "$W" commit -qm "repobeagle: $VERDICT for $GITHUB_SHA"
          git -C "$W" push -q -f origin "HEAD:$B"
        env:
          GH_TOKEN: ${{ github.token }}
          BADGE_BRANCH: ${{ inputs.badge-branch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          VERDICT: ${{ steps.scan.outputs.verdict }}

      - name: Set repobeagle/scan commit status
        if: inputs.set-status
        continue-on-error: true            # needs statuses: write; degrades gracefully
        run: |
          set -euo pipefail
          read -r STATE DESC < <(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));c=d["counts"];v=d["verdict"];s=(d.get("meta") or {}).get("scope") or {};print({"GREEN":"success","YELLOW":"neutral","RED":"failure"}[v], "RepoBeagle: %s (%s critical / %s high)%s" % (v,c["critical"],c["high"], (" [diff since %s]" % str(s.get("since"))[:12]) if s else ""))' "$OUT/beagle.json")
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$STATE" -f context="repobeagle/scan" -f description="$DESC" \
            -f target_url="$RUN_URL"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Fail on RED
        if: inputs.fail-on-red && steps.scan.outputs.rc == '2'
        run: |
          echo "RepoBeagle verdict is RED (see the repobeagle/scan status)"
          exit 1

      # Publishes first, then gates: the new report (and every finding) stays available
      # even when the job fails. Matching is rule + file, so line moves are not changes.
      - name: Gate on findings added since the last report
        if: inputs.baseline
        run: |
          set -euo pipefail
          if [ ! -s "$OUT/baseline.json" ]; then
            echo "no baseline report: gate skipped (first run for this repository, or badge-branch is empty)"
            exit 0
          fi
          set +e
          python3 "$TOOLS/repobeagle.py" diff "$OUT/baseline.json" "$OUT/beagle.json" \
            --min-severity "$BASELINE_MIN_SEVERITY" --no-color
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then exit 0; fi
          if [ "$rc" -eq 1 ]; then
            echo "repobeagle: new findings at/above $BASELINE_MIN_SEVERITY since the last published report"
            exit 1
          fi
          echo "repobeagle diff failed (rc=$rc)"
          exit 1
        env:
          BASELINE_MIN_SEVERITY: ${{ inputs.baseline-min-severity }}

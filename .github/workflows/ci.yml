# Regression gate: the offline suite must pass on every push and PR.
# It needs no Docker image, no network scanners and no repository code executed.
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned development tools
        run: python3 -m pip install --quiet -r requirements-dev.txt
      # Syntax-level lint only: the scanner is a single 3.4k-line module and the
      # fixtures intentionally contain odd code, so style rules would be noise.
      - name: Byte-compile the scanner and tools
        run: python3 -m py_compile repobeagle.py tools/make_badge.py tests/test_banner.py tests/test_trust.py tests/test_privacy.py tests/test_toolchain.py tests/test_explain.py tests/test_rule_fixtures.py tests/test_fuzz.py tests/test_determinism.py tests/test_markdown_snapshot.py tests/test_sarif_schema.py tests/test_mcp_interop.py tests/test_capabilities.py tests/test_coverage.py tests/test_web.py tests/test_refs.py tests/test_scope.py tests/test_remediation.py tests/test_osv.py tests/test_packaging.py tests/test_fix.py tests/test_head.py tests/test_suppressions.py tests/test_init_html.py tests/test_sbom.py tests/test_feedback.py tests/test_gate.py tests/test_deadline.py tests/test_supply_chain.py tests/test_dependency_graph.py tests/test_batch.py tests/test_cache.py tests/test_config.py tests/test_personas.py tests/test_rule_packs.py
      - name: Lint for syntax errors and undefined names
        run: ruff check --no-cache --select E9,F63,F7,F82 repobeagle.py tools tests/*.py
      - name: Type-check the scanner and tools (mypy.ini)
        run: mypy
      - name: Validate the SARIF export against the vendored 2.1.0 schema
        run: python3 tests/test_sarif_schema.py
      - name: Offline regression suite (fixtures only; no image, no OSV, no trust API)
        run: tests/run_tests.sh --offline
      - name: Build and install the wheel (non-Docker light mode)
        run: |
          python3 -m build --wheel --outdir dist
          python3 -m pip install --quiet --force-reinstall --no-deps dist/*.whl
          repobeagle --version
          test -f "$(python3 -c 'import sys;print(sys.prefix)')/share/repobeagle/custom.yml"
          cd "$RUNNER_TEMP"
          repobeagle scan "$GITHUB_WORKSPACE/tests/fixtures/trap-npm" --no-docker --no-osv --no-trust \
            --json /tmp/light.json --no-color || true
          python3 -c "import json,sys;d=json.load(open('/tmp/light.json'));print('light-mode verdict:',d['verdict']);sys.exit(0 if d['verdict']=='RED' and d['counts']['critical']>=2 else 1)"
      - name: Compute the OSV database cache week
        id: osvweek
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the cached offline OSV database (populated by the nightly job)
        id: osvcache
        uses: actions/cache/restore@v4
        with:
          path: .osv-cache/osv-scalibr
          key: osv-db-${{ steps.osvweek.outputs.week }}
          restore-keys: osv-db-
      - name: Deterministic vulnerability scan with the cached offline OSV database
        if: steps.osvcache.outputs.cache-hit == 'true'
        env:
          XDG_CACHE_HOME: ${{ github.workspace }}/.osv-cache
        run: |
          python3 repobeagle.py scan tests/fixtures/control-vuln --offline-vulnerabilities --no-trust \
            --json /tmp/osv.json --no-color || true
          python3 - <<'PY'
          import json
          import sys
          d = json.load(open("/tmp/osv.json")); m = d.get("meta") or {}; db = m.get("osv_db") or {}
          ok = (m.get("offline_vulnerabilities") is True and db.get("ecosystems") and db.get("stale") is False)
          print("PASS offline OSV scan records its database" if ok else f"FAIL offline OSV: {db}")
          if any("not installed" in n for n in d.get("notes") or []):
              print("note: osv-scanner is not installed on this runner; the database path/age is still asserted")
          sys.exit(0 if ok else 1)
          PY
      - name: Offline OSV database not cached yet
        if: steps.osvcache.outputs.cache-hit != 'true'
        run: echo "no cached OSV database yet (the nightly job populates it); deterministic vulnerability findings skipped"

  gate:
    permissions:
      contents: read
    uses: ./.github/workflows/gate.yml
    with:
      entries: tests/fixtures/gate/clean-list.txt
      tools-ref: ${{ github.sha }}

  packaging-macos:
    runs-on: macos-latest        # arm64: the acceptance OS for the light mode
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Packaging contract tests (macOS arm64)
        run: python3 tests/test_packaging.py
      - name: Install the light mode with pipx
        run: |
          set -euo pipefail
          python3 -m pip install --user pipx
          python3 -m pipx install .
      - name: "Acceptance: the installed CLI scans a fixture with --no-docker"
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$PATH"
          repobeagle --version
          cd /tmp
          set +e
          repobeagle scan "$GITHUB_WORKSPACE/tests/fixtures/trap-npm" --no-docker --no-osv --no-trust --no-color --json /tmp/report.json
          code=$?
          set -e
          python3 -c "import json,sys; d=json.load(open('/tmp/report.json')); v=open(sys.argv[1]).read().strip().lstrip('v'); assert sys.argv[2] in ('0','1','2'), sys.argv[2]; assert d['version']==v, (d['version'], v); print('PASS macOS light-mode scan', d['verdict'], d['counts'], 'exit', sys.argv[2])" "$GITHUB_WORKSPACE/VERSION" "$code"

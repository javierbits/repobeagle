# End-to-end proof of the SARIF path: export a fixture report, upload it to GitHub
# code scanning twice (once per job — the action allows one run per job per
# tool/category), then assert that the alerts stay at the unique-fingerprint count,
# i.e. the second identical analysis dedupes instead of duplicating. Fixture alerts
# are deliberate: trap-npm is malicious by design.
name: sarif
on:
  push:
    branches: [main]
    paths:
      - repobeagle.py
      - repobeagle/**
      - tests/fixtures/**
      - tests/schema/**
      - tests/test_sarif_schema.py
      - requirements-dev.txt
      - .github/workflows/sarif.yml
  pull_request:
    paths:
      - repobeagle.py
      - repobeagle/**
      - tests/fixtures/**
      - tests/schema/**
      - tests/test_sarif_schema.py
      - requirements-dev.txt
      - .github/workflows/sarif.yml
  workflow_dispatch:
permissions:
  contents: read
  security-events: write   # upload SARIF to code scanning
concurrency:
  group: sarif-${{ github.ref }}
  cancel-in-progress: true
jobs:
  upload:
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export the fixture report as SARIF (offline)
        run: |
          mkdir -p out
          python3 repobeagle.py scan tests/fixtures/trap-npm --no-color --json out/report.json --no-osv --no-trust || true
          python3 repobeagle.py export out/report.json --format sarif -o out/report.sarif
          python3 -c 'import json;d=json.load(open("out/report.sarif"));print("results:", len(d["runs"][0]["results"]))'
      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: out/report.sarif
          category: repobeagle-trap-npm
      - uses: actions/upload-artifact@v4
        with:
          name: sarif-${{ matrix.run }}
          path: out/report.sarif
          retention-days: 1

  dedupe:
    needs: upload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sarif-1
          path: out
      - name: Both identical uploads must dedupe to the unique fingerprints
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected="$(python3 -c 'import json;d=json.load(open("out/report.sarif"));print(len({r["partialFingerprints"]["repobeagle/v1"] for r in d["runs"][0]["results"]}))')"
          # Analyses and alerts live on the analysed ref: refs/pull/<n>/merge for a PR,
          # refs/heads/main for a push. The API defaults to the default branch.
          analyses="repos/$GITHUB_REPOSITORY/code-scanning/analyses?per_page=100&ref=$GITHUB_REF&tool_name=repobeagle"
          alerts="repos/$GITHUB_REPOSITORY/code-scanning/alerts?per_page=100&ref=$GITHUB_REF&tool_name=repobeagle"
          n=0
          for i in $(seq 1 36); do
            n=$(gh api "$analyses" --jq 'length' 2>/dev/null || true)
            echo "attempt $i: analyses=${n:-none} (need 2)"
            if [ "${n:-0}" -ge 2 ]; then break; fi
            sleep 5
          done
          if [ "${n:-0}" -lt 2 ]; then echo "both analyses are not visible"; exit 1; fi
          for i in $(seq 1 24); do
            a=$(gh api "$alerts" --jq 'length' 2>/dev/null || true)
            echo "attempt $i: alerts=${a:-none} unique fingerprints=$expected"
            if [ "${a:-0}" -eq "$expected" ]; then
              echo "PASS $a alerts for $expected fingerprints: the duplicate upload deduped"
              exit 0
            fi
            if [ "${a:-0}" -gt "$expected" ]; then
              echo "dedupe failed: $a alerts for $expected fingerprints"
              exit 1
            fi
            sleep 5
          done
          echo "no alerts appeared"; exit 1

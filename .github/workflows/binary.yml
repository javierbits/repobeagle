# Airgapped / light-mode artifacts: one-file PyInstaller builds on tags and manual runs.
# The binary bundles Python only; it still shells out to the host scanner tools, and the
# Docker image remains the recommended hardened path.
name: binary
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-amd64
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: macos-14
            label: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the one-file binary (pinned PyInstaller)
        run: bash tools/build_binary.sh
      - uses: actions/upload-artifact@v4
        with:
          name: repobeagle-${{ matrix.label }}
          path: dist/repobeagle

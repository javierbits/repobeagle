# Public precomputed index (T8): build the static site, sign every report with the
# official index workflow identity, verify every report BEFORE publishing, then deploy
# to GitHub Pages. Results accumulate on the `index` branch (refresh-by-SHA: an unchanged
# HEAD is skipped, and an existing signed result is reused). Scans run in the pinned image.
name: index
on:
  schedule:
    - cron: "43 5 * * 1"     # weekly (Mon 05:43 UTC)
  workflow_dispatch:
  pull_request:
    paths: ["repobeagle.py", "repobeagle/**", "tools/index-repos.txt", ".github/workflows/index.yml", "VERSION"]
  push:
    branches: [main]
    paths: ["repobeagle.py", "repobeagle/**", "tools/index-repos.txt", ".github/workflows/index.yml", "VERSION"]
permissions:
  contents: write            # persist results on the index branch
  pages: write               # deploy the static site
  id-token: write            # keyless Sigstore signing
concurrency:
  group: index
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240     # acceptance: 1k repos in under 4 h with --jobs 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: sigstore/cosign-installer@v3

      - name: Build the pinned scanner image
        run: docker build -t repobeagle:index .

      - name: Restore previous results (refresh by SHA only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/prev-index"
          mkdir -p _site
          if git ls-remote --exit-code --heads origin index >/dev/null 2>&1; then
            git clone -q --depth 1 --branch index \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$P"
            cp -a "$P/results" _site/
            echo "restored $(find _site/results -name '*.json' | wc -l) previous result file(s)"
          else
            echo "no index branch yet: first build"
          fi

      - name: Scan, sign and verify the index
        env:
          BEAGLE_IMAGE: repobeagle:index
          BEAGLE_MEMORY: 2g
        run: |
          set -euo pipefail
          python3 repobeagle.py index --repos tools/index-repos.txt --out _site \
            --jobs 20 --cap 1000 --sign | tee "$RUNNER_TEMP/index.log"
          # Acceptance: every published report must verify before anything deploys.
          count=0
          for f in _site/results/*/*.json; do
            case "$f" in *.sigstore.json) continue ;; esac
            bundle="${f%.json}.sigstore.json"
            test -f "$bundle" || { echo "missing bundle for $f"; exit 1; }
            python3 repobeagle.py verify --report "$f" --bundle "$bundle" \
              --identity-regexp '^https://github\.com/javierbits/repobeagle/\.github/workflows/index\.yml@refs/(pull/[0-9]+/merge|heads/main)$' \
              >/dev/null
            count=$((count + 1))
          done
          echo "verified $count signed report(s)"

      - name: Persist results on the index branch
        if: github.event_name != 'pull_request'   # PR builds verify signing but do not write history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          P="$RUNNER_TEMP/prev-index"
          if [ ! -d "$P/.git" ]; then
            mkdir -p "$P"
            git -C "$P" init -q
            git -C "$P" checkout -q --orphan index
            git -C "$P" remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          cp -a _site/. "$P"/
          cd "$P"
          git add -A
          git -c user.name="repobeagle-index" -c user.email="repobeagle[bot]@users.noreply.github.com" \
            commit -qm "repobeagle: index $(date -u +%F)" || echo "no new results"
          git push -q origin HEAD:index

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'   # PR builds must not publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

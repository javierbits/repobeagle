# Type checking is scoped to the scanner and its tools: the fixtures deliberately
# contain odd code and the tests/ scripts are exercised by running them, so they are
# not type-check targets. `check_untyped_defs` makes mypy check the bodies of the
# untyped functions too, which is where the regex/JSON bugs live.
[mypy]
python_version = 3.12
files = repobeagle.py, tools/make_badge.py
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
exclude = (^tests/fixtures/)

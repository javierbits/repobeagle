# Type checking is scoped to the scanner and its tools: the fixtures deliberately
# contain odd code and the tests/ scripts are exercised by running them, so they are
# not type-check targets. `check_untyped_defs` makes mypy check the bodies of the
# untyped functions too, which is where the regex/JSON bugs live.
[mypy]
python_version = 3.12
files = repobeagle, tools/make_badge.py, tools/gen_rule_registry.py, tools/scoreboard.py
check_untyped_defs = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
exclude = (^tests/fixtures/)

# PyJWT is an optional App-only dependency (present in the image, not in the scanner's
# stdlib-only path); it is not installed in every dev/CI environment.
[mypy-jwt.*]
ignore_missing_imports = True
